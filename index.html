<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starfield Close — Dynamic 45s Chatbot Theme Fading</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #f3f6ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-x: hidden;
      height: 100%;
    }
    #scene {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 0;
      pointer-events: none;
    }
    #scroll-host {
      position: relative;
      height: 300vh;
      z-index: 1;
      pointer-events: auto;
    }
    .hud-header {
      position: fixed;
      top: 24px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      pointer-events: auto;
    }
    .hud-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      background: rgba(12, 18, 38, 0.65);
      border: 1px solid rgba(150, 175, 230, 0.18);
      backdrop-filter: blur(12px);
      padding: 10px 18px;
      border-radius: 999px;
    }
    .hud-brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--theme-accent, #5df0a8);
      box-shadow: 0 0 10px var(--theme-accent, #5df0a8);
      transition: background 0.5s ease, box-shadow 0.5s ease;
    }
    .hud-theme-pill {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(12, 18, 38, 0.7);
      border: 1px solid rgba(150, 175, 230, 0.2);
      backdrop-filter: blur(16px);
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 13.5px;
      color: #9aa6c4;
      box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.6);
    }
    .theme-name {
      color: #f3f6ff;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .fade-timer {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 6px;
      font-size: 12px;
      font-family: monospace;
      color: var(--theme-accent, #5df0a8);
    }
    .theme-progress-track {
      width: 60px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .theme-progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #5df0a8, #7c5cff);
      border-radius: 999px;
      transition: width 0.1s linear;
    }
    .theme-controls {
      display: flex;
      gap: 6px;
    }
    .theme-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #f3f6ff;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11.5px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    .theme-btn:hover {
      background: rgba(255, 255, 255, 0.14);
    }
    .hud-hero {
      position: fixed;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 5;
      pointer-events: none;
      max-width: 640px;
      padding: 0 20px;
    }
    .hud-title {
      font-size: clamp(38px, 6vw, 68px);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.05;
      text-shadow: 0 4px 40px rgba(0, 0, 0, 0.8);
      margin-bottom: 16px;
    }
    .hud-sub {
      font-size: clamp(16px, 2.2vw, 20px);
      color: #9aa6c4;
      line-height: 1.6;
      text-shadow: 0 2px 24px rgba(0, 0, 0, 0.7);
    }
    .scroll-hint {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #9aa6c4;
      background: rgba(12, 18, 38, 0.5);
      border: 1px solid rgba(150, 175, 230, 0.15);
      padding: 8px 18px;
      border-radius: 999px;
      backdrop-filter: blur(8px);
      animation: pulse-scroll 2.5s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes pulse-scroll {
      0%, 100% { opacity: 0.6; transform: translate(-50%, 0); }
      50% { opacity: 1; transform: translate(-50%, 6px); }
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.143.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.143.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <!-- Fixed Full-Viewport Three.js WebGL Canvas -->
  <canvas id="scene"></canvas>

  <!-- HUD Status Bar with 45-Second Dynamic Theme Engine -->
  <div class="hud-header">
    <div class="hud-brand">
      <span class="hud-brand-dot" id="themeDot"></span>
      <span>Radiance Starfield</span>
    </div>

    <div class="hud-theme-pill">
      <span>Theme:</span>
      <span class="theme-name" id="themeName">Mint Nebula</span>
      <span class="fade-timer" id="fadeTimer">45s fade</span>
      <div class="theme-progress-track">
        <div class="theme-progress-bar" id="themeBar"></div>
      </div>
      <div class="theme-controls">
        <button class="theme-btn" id="nextThemeBtn" title="Jump to next chatbot theme">Next ❯</button>
        <button class="theme-btn" id="togglePauseBtn" title="Pause or resume 45s fade cycle">Pause</button>
      </div>
    </div>
  </div>

  <div class="hud-hero">
    <h1 class="hud-title">Starfield Close</h1>
    <p class="hud-sub">Endless tunnel of starlight dynamically shifting colors every 45 seconds across Radiance chatbot palettes.</p>
  </div>

  <!-- Tall scroll host driving forward dive -->
  <div id="scroll-host"></div>
  <div class="scroll-hint">SCROLL &#8595;</div>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
    import { GammaCorrectionShader } from 'three/addons/shaders/GammaCorrectionShader.js';
    import { CopyShader } from 'three/addons/shaders/CopyShader.js';

    // Helper: convert hex string to THREE.Vector3
    function hexToVec3(hex) {
      const n = parseInt(hex.slice(1), 16);
      return new THREE.Vector3(((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255);
    }

    // Default configuration matching background.txt verbatim
    const CONFIG = {
      bgColor: '#0a0a24',
      flameColor: '#aee9ff',
      flameColor2: '#c79bff',
      flameAmt: 0.2,
      colorA: '#aef6cf',
      colorB: '#5fe6a0',
      colorC: '#eafff2',
      opacity: 2,
      pointSize: 50,
      brightness: 1.85,
      drift: 2.35,
      twinkle: 1,
      spin: 0.03,
      repelRadius: 5,
      repelStrength: 0.35,
      scrollPush: 8,
      scrollDrift: 6,
      scrollSpin: 0.1,
      parallax: 0.6,
    };

    // Chatbot theme palettes for the 45-second slow fading metamorphosis
    const CHATBOT_THEMES = [
      {
        id: 'mint',
        name: 'Mint Nebula (Default)',
        bgColor: '#0a0a24',
        flameA: '#aee9ff',
        flameB: '#c79bff',
        colorA: '#aef6cf',
        colorB: '#5fe6a0',
        colorC: '#eafff2',
        accent: '#5df0a8'
      },
      {
        id: 'violet',
        name: 'Violet Aurora',
        bgColor: '#0c0818',
        flameA: '#c4a0ff',
        flameB: '#6d4aff',
        colorA: '#bfa7ff',
        colorB: '#7c5cff',
        colorC: '#e27aff',
        accent: '#7c5cff'
      },
      {
        id: 'ocean',
        name: 'Ocean Azure',
        bgColor: '#040d1a',
        flameA: '#38bdf8',
        flameB: '#0284c7',
        colorA: '#80d8ff',
        colorB: '#49a8e8',
        colorC: '#b3e5fc',
        accent: '#38bdf8'
      },
      {
        id: 'neon',
        name: 'Cyber Neon',
        bgColor: '#050e12',
        flameA: '#00f5d4',
        flameB: '#f72585',
        colorA: '#00f5d4',
        colorB: '#70e000',
        colorC: '#f72585',
        accent: '#00f5d4'
      },
      {
        id: 'amber',
        name: 'Solar Amber',
        bgColor: '#140a04',
        flameA: '#fbbf24',
        flameB: '#d97706',
        colorA: '#fde68a',
        colorB: '#f59e0b',
        colorC: '#fb923c',
        accent: '#f59e0b'
      },
      {
        id: 'rose',
        name: 'Cosmic Rose',
        bgColor: '#16050e',
        flameA: '#f43f5e',
        flameB: '#c084fc',
        colorA: '#fda4af',
        colorB: '#f43f5e',
        colorC: '#e879f9',
        accent: '#f43f5e'
      },
      {
        id: 'celestial',
        name: 'Arctic Celestial',
        bgColor: '#050d18',
        flameA: '#67e8f9',
        flameB: '#818cf8',
        colorA: '#a5f3fc',
        colorB: '#38bdf8',
        colorC: '#c084fc',
        accent: '#38bdf8'
      },
      {
        id: 'amethyst',
        name: 'Amethyst Night',
        bgColor: '#0d0617',
        flameA: '#c084fc',
        flameB: '#e879f9',
        colorA: '#d8b4fe',
        colorB: '#a855f7',
        colorC: '#f472b6',
        accent: '#a855f7'
      }
    ].map(t => ({
      ...t,
      bgVec: hexToVec3(t.bgColor),
      flameAVec: hexToVec3(t.flameA),
      flameBVec: hexToVec3(t.flameB),
      colorAVec: hexToVec3(t.colorA),
      colorBVec: hexToVec3(t.colorB),
      colorCVec: hexToVec3(t.colorC)
    }));

    const canvas = document.getElementById('scene');
    const renderer = new THREE.WebGL1Renderer({ canvas, antialias: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.VSMShadowMap;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    scene.fog = new THREE.Fog(0x000000, 0, 15);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 80);
    camera.position.set(0, 0, 5);

    const LAYERS = { NONE: 0, TORUS_SCENE: 1, BLOOM_SCENE: 2, ENTIRE_SCENE: 3 };
    camera.layers.enable(LAYERS.TORUS_SCENE);
    camera.layers.enable(LAYERS.BLOOM_SCENE);
    camera.layers.enable(LAYERS.ENTIRE_SCENE);
    scene.add(camera);

    // Dummy halo texture (1x1 black) to satisfy FinalPass sampler
    const dummyHalo = new THREE.DataTexture(new Uint8Array([0, 0, 0, 0]), 1, 1, THREE.RGBAFormat);
    dummyHalo.needsUpdate = true;

    // Postprocessing: Three Composers
    const renderScene = new RenderPass(scene, camera);

    // 1. torusComposer
    const torusComposer = new EffectComposer(renderer);
    torusComposer.renderToScreen = false;
    torusComposer.addPass(renderScene);
    torusComposer.addPass(new ShaderPass(GammaCorrectionShader));
    torusComposer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.22, 0.2, 0));
    torusComposer.addPass(new ShaderPass(CopyShader));

    // 2. bloomComposer
    const bloomComposer = new EffectComposer(renderer);
    bloomComposer.renderToScreen = false;
    bloomComposer.addPass(renderScene);
    bloomComposer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.4, 0.55, 0));
    bloomComposer.addPass(new ShaderPass(GammaCorrectionShader));

    // 3. finalComposer with FinalPass Shader
    const FinalPassShader = {
      uniforms: {
        iTime: { value: 0 },
        tDiffuse: { value: null },
        torusTexture: { value: null },
        bloomTexture: { value: null },
        haloTexture: { value: dummyHalo },
        uBg: { value: hexToVec3(CONFIG.bgColor) },
        uFlameA: { value: hexToVec3(CONFIG.flameColor) },
        uFlameB: { value: hexToVec3(CONFIG.flameColor2) },
        uFlameAmt: { value: CONFIG.flameAmt }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float iTime;
        uniform sampler2D tDiffuse;
        uniform sampler2D bloomTexture;
        uniform sampler2D torusTexture;
        uniform sampler2D haloTexture;
        uniform vec3 uBg;
        uniform vec3 uFlameA;
        uniform vec3 uFlameB;
        uniform float uFlameAmt;
        varying vec2 vUv;

        vec3 warp3d(vec3 pos, float t) {
          float curv = .8, a = 1.9, b = 0.7;
          pos *= 2.;
          pos.x += curv * sin(t + a * pos.y) + t * b;
          pos.y += curv * cos(t + a * pos.x);
          pos.z += curv * sin(t + a * pos.z) + t * b;
          pos.z += curv * cos(t + a * pos.y);
          pos.x += curv * sin(t + a * pos.x);
          pos.x += curv * cos(t + a * pos.z);
          return 0.5 + 0.5 * cos(pos.xyz + vec3(1, 2, 4));
        }

        void main() {
          vec2 uv = 2. * vUv - 1.;
          vec3 w = pow(warp3d(vec3(uv.x, sin(uv.y), uv.y), iTime * 1.5), vec3(1.5));
          vec3 flame = 1.5 * uFlameA * w.x;
          flame *= w.y;
          flame += uFlameB * w.z;
          flame *= smoothstep(0.25, 1., abs(uv.y));
          float md = smoothstep(-0.7, 1., -uv.y * uv.x);
          flame *= md * md;
          vec3 bg = uBg * (1.0 - 0.4 * length(uv));
          vec3 halo = texture2D(haloTexture, vUv).xyz;
          gl_FragColor = vec4(bg + flame * uFlameAmt + texture2D(bloomTexture, vUv).xyz + texture2D(torusTexture, vUv).xyz + texture2D(tDiffuse, vUv).xyz + halo, 1.);
        }
      `
    };

    const finalComposer = new EffectComposer(renderer);
    finalComposer.addPass(renderScene);
    const finalPass = new ShaderPass(FinalPassShader);
    finalComposer.addPass(finalPass);

    finalPass.uniforms.bloomTexture.value = bloomComposer.renderTarget1.texture;
    finalPass.uniforms.torusTexture.value = torusComposer.renderTarget1.texture;

    // Build Starfield BufferGeometry
    const count = 4200;
    const depth = 30;

    const positions = new Float32Array(count * 3);
    const palette = new Float32Array(count);
    const bright = new Float32Array(count);
    const scales = new Float32Array(count);
    const phases = new Float32Array(count);

    for (let i = 0; i < count; i++) {
      const i3 = i * 3;
      positions[i3]     = (Math.random() - 0.5) * 24;
      positions[i3 + 1] = (Math.random() - 0.5) * 16;
      positions[i3 + 2] = (Math.random() - 0.5) * 30;
      palette[i] = Math.floor(Math.random() * 3);
      bright[i]  = 0.7 + Math.random() * 0.6;
      scales[i]  = 0.5 + Math.pow(Math.random(), 1.4) * 2.5;
      phases[i]  = Math.random();
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geometry.setAttribute('aScale', new THREE.Float32BufferAttribute(scales, 1));
    geometry.setAttribute('aPhase', new THREE.Float32BufferAttribute(phases, 1));
    geometry.setAttribute('aPalette', new THREE.Float32BufferAttribute(palette, 1));
    geometry.setAttribute('aBright', new THREE.Float32BufferAttribute(bright, 1));

    // Custom Starfield ShaderMaterial
    const starMaterial = new THREE.ShaderMaterial({
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      uniforms: {
        uTime: { value: 0 },
        uSize: { value: CONFIG.pointSize },
        uOpacity: { value: 0 },
        uDrift: { value: 0 },
        uDepth: { value: 30 },
        uTwinkle: { value: CONFIG.twinkle },
        uCursor: { value: new THREE.Vector3() },
        uRepelRadius: { value: CONFIG.repelRadius },
        uRepelStrength: { value: CONFIG.repelStrength },
        uActivity: { value: 0 },
        uColorA: { value: hexToVec3(CONFIG.colorA) },
        uColorB: { value: hexToVec3(CONFIG.colorB) },
        uColorC: { value: hexToVec3(CONFIG.colorC) },
        uBrightness: { value: CONFIG.brightness }
      },
      vertexShader: `
        uniform float uTime; uniform float uSize; uniform float uDrift; uniform float uDepth; uniform float uTwinkle;
        uniform vec3 uCursor; uniform float uRepelRadius; uniform float uRepelStrength; uniform float uActivity;
        uniform vec3 uColorA; uniform vec3 uColorB; uniform vec3 uColorC;
        attribute float aScale; attribute float aPhase; attribute float aPalette; attribute float aBright;
        varying vec3 vColor; varying float vTwinkle;
        void main() {
          vec3 pos = position;
          pos.z = mod(pos.z + uDrift + (uDepth * 0.5), uDepth) - (uDepth * 0.5);

          float tw = sin(uTime * 1.6 + aPhase * 6.2831);
          vTwinkle = (1.0 - uTwinkle) + uTwinkle * (0.55 + 0.45 * tw);

          vec4 modelPosition = modelMatrix * vec4(pos, 1.0);

          vec3 toParticle = modelPosition.xyz - uCursor;
          float dist = length(toParticle);
          float falloff = smoothstep(uRepelRadius, 0.0, dist);
          modelPosition.xyz += normalize(toParticle + vec3(0.0001)) * falloff * uRepelStrength * uActivity;

          vec4 viewPosition = viewMatrix * modelPosition;
          gl_Position = projectionMatrix * viewPosition;
          gl_PointSize = uSize * aScale;
          gl_PointSize *= (1.0 / -viewPosition.z);

          vec3 base = aPalette < 0.5 ? uColorA : (aPalette < 1.5 ? uColorB : uColorC);
          vColor = base * aBright;
        }
      `,
      fragmentShader: `
        uniform float uOpacity; uniform float uBrightness;
        varying vec3 vColor; varying float vTwinkle;
        void main() {
          vec2 uv = gl_PointCoord - 0.5;
          float d = length(uv);
          if (d > 0.5) discard;
          float strength = pow(1.0 - d * 2.0, 4.0);
          vec3 color = mix(vec3(0.0), vColor, strength);
          gl_FragColor = vec4(color * uBrightness, strength * uOpacity * vTwinkle);
        }
      `
    });

    const points = new THREE.Points(geometry, starMaterial);
    const group = new THREE.Group();
    group.add(points);
    scene.add(group);

    points.layers.enable(LAYERS.TORUS_SCENE);
    points.layers.enable(LAYERS.BLOOM_SCENE);
    points.layers.enable(LAYERS.ENTIRE_SCENE);

    // Pointer Interaction (World Cursor Void Repel)
    let lastMove = performance.now();
    let active = false;
    const POINTER = {
      ndc: new THREE.Vector2(),
      world: new THREE.Vector3(),
      activity: 0
    };

    window.addEventListener('mousemove', (e) => {
      POINTER.ndc.x = (e.clientX / window.innerWidth) * 2 - 1;
      POINTER.ndc.y = -(e.clientY / window.innerHeight) * 2 + 1;
      active = true;
      lastMove = performance.now();
    });

    window.addEventListener('mouseout', () => {
      active = false;
    });

    // Scroll with Double-Damped Smoothing
    let scrollTarget = 0;
    let scrollSmooth = 0;
    let scrollCurrent = 0;
    const mouseSmooth = new THREE.Vector2();

    window.addEventListener('scroll', () => {
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      scrollTarget = maxScroll > 0 ? Math.min(Math.max(window.scrollY / maxScroll, 0), 1) : 0;
    });

    // 45-Second Dynamic Theme Fading Engine
    const FADE_PERIOD = 45.0; // 45 seconds slow fading transition
    let isPaused = false;
    let pauseTimeAccumulator = 0;
    let themeOffset = 0;

    const themeNameEl = document.getElementById('themeName');
    const fadeTimerEl = document.getElementById('fadeTimer');
    const themeBarEl = document.getElementById('themeBar');
    const themeDotEl = document.getElementById('themeDot');

    document.getElementById('nextThemeBtn').addEventListener('click', () => {
      themeOffset += 1;
    });

    const togglePauseBtn = document.getElementById('togglePauseBtn');
    togglePauseBtn.addEventListener('click', () => {
      isPaused = !isPaused;
      togglePauseBtn.textContent = isPaused ? 'Resume' : 'Pause';
    });

    // Animation Loop
    let t0 = performance.now() / 1000;
    const appearStart = performance.now();
    let uDrift = 0;

    function animate() {
      requestAnimationFrame(animate);

      const now = performance.now();
      const t = now / 1000;
      const dt = Math.min(0.05, t - t0);
      t0 = t;

      // Update 45-second Dynamic Theme Metamorphosis
      if (!isPaused) {
        pauseTimeAccumulator += dt;
      }

      const totalTime = pauseTimeAccumulator + themeOffset * FADE_PERIOD;
      const cycleProgress = (totalTime % (CHATBOT_THEMES.length * FADE_PERIOD)) / FADE_PERIOD;
      const currentIdx = Math.floor(cycleProgress) % CHATBOT_THEMES.length;
      const nextIdx = (currentIdx + 1) % CHATBOT_THEMES.length;
      const localProgress = cycleProgress - Math.floor(cycleProgress);

      // S-curve smooth fading interpolation
      const blend = 0.5 - 0.5 * Math.cos(localProgress * Math.PI);

      const themeA = CHATBOT_THEMES[currentIdx];
      const themeB = CHATBOT_THEMES[nextIdx];

      starMaterial.uniforms.uColorA.value.lerpVectors(themeA.colorAVec, themeB.colorAVec, blend);
      starMaterial.uniforms.uColorB.value.lerpVectors(themeA.colorBVec, themeB.colorBVec, blend);
      starMaterial.uniforms.uColorC.value.lerpVectors(themeA.colorCVec, themeB.colorCVec, blend);

      finalPass.uniforms.uBg.value.lerpVectors(themeA.bgVec, themeB.bgVec, blend);
      finalPass.uniforms.uFlameA.value.lerpVectors(themeA.flameAVec, themeB.flameAVec, blend);
      finalPass.uniforms.uFlameB.value.lerpVectors(themeA.flameBVec, themeB.flameBVec, blend);

      // Update HUD elements
      const timeLeft = Math.max(0, Math.ceil(FADE_PERIOD * (1 - localProgress)));
      if (themeNameEl) themeNameEl.textContent = `${themeA.name} → ${themeB.name}`;
      if (fadeTimerEl) fadeTimerEl.textContent = `${timeLeft}s`;
      if (themeBarEl) themeBarEl.style.width = `${(localProgress * 100).toFixed(1)}%`;
      if (themeDotEl) themeDotEl.style.background = themeA.accent;

      // Pointer Raycast to z=0
      if (active) {
        const p = new THREE.Vector3(POINTER.ndc.x, POINTER.ndc.y, 0.5);
        p.unproject(camera);
        const dir = p.sub(camera.position).normalize();
        if (Math.abs(dir.z) > 1e-4) {
          const tIntersect = -camera.position.z / dir.z;
          if (tIntersect > 0 && isFinite(tIntersect)) {
            const target = camera.position.clone().add(dir.multiplyScalar(tIntersect));
            POINTER.world.lerp(target, 0.12);
          }
        }
      } else {
        POINTER.world.lerp(new THREE.Vector3(0, 0, 0), 0.12);
      }

      const idleSec = (now - lastMove) / 1000;
      const want = (active && idleSec < 3) ? 1 : 0;
      POINTER.activity += (want - POINTER.activity) * 0.06;

      starMaterial.uniforms.uCursor.value.copy(POINTER.world);
      starMaterial.uniforms.uActivity.value = POINTER.activity;

      // Double-Damped Scroll Smoothing
      scrollSmooth += (scrollTarget - scrollSmooth) * 0.10;
      scrollCurrent += (scrollSmooth - scrollCurrent) * 0.06;
      mouseSmooth.x += (POINTER.ndc.x - mouseSmooth.x) * 0.06;
      mouseSmooth.y += (POINTER.ndc.y - mouseSmooth.y) * 0.06;

      const scroll = scrollCurrent;
      const m = mouseSmooth;

      starMaterial.uniforms.uTime.value = t;
      uDrift += dt * (CONFIG.drift + scroll * CONFIG.scrollDrift);
      starMaterial.uniforms.uDrift.value = uDrift;

      camera.position.set(m.x * CONFIG.parallax, m.y * CONFIG.parallax, 5 - scroll * CONFIG.scrollPush);
      camera.lookAt(m.x * CONFIG.parallax, m.y * CONFIG.parallax, -10);

      // Appear Fade
      const elapsed = now - appearStart;
      const fade = Math.min(Math.max((elapsed - 300) / 1400, 0), 1);
      starMaterial.uniforms.uOpacity.value = fade * CONFIG.opacity;

      group.rotation.z += dt * (CONFIG.spin + scroll * CONFIG.scrollSpin);

      finalPass.uniforms.iTime.value = t;

      // Render 3 Composers in order using Camera Layers
      camera.layers.set(LAYERS.TORUS_SCENE);
      torusComposer.render();
      camera.layers.set(LAYERS.BLOOM_SCENE);
      bloomComposer.render();
      camera.layers.set(LAYERS.ENTIRE_SCENE);
      finalComposer.render();
    }

    animate();

    // Resize Handler
    window.addEventListener('resize', () => {
      const w = window.innerWidth;
      const h = window.innerHeight;
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(w, h);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();

      torusComposer.setPixelRatio(window.devicePixelRatio);
      torusComposer.setSize(w, h);
      bloomComposer.setPixelRatio(window.devicePixelRatio);
      bloomComposer.setSize(w, h);
      finalComposer.setPixelRatio(window.devicePixelRatio);
      finalComposer.setSize(w, h);

      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      scrollTarget = maxScroll > 0 ? Math.min(Math.max(window.scrollY / maxScroll, 0), 1) : 0;
    });
  </script>
</body>
</html>
