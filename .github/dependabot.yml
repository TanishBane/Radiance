# ═══════════════════════════════════════════════════════════════════════════════
# RADIANCE PLATFORM — DEPENDABOT AUTOMATION CONFIGURATION
# Reference: https://docs.github.com/code-security/dependabot
# ═══════════════════════════════════════════════════════════════════════════════

version: 2
updates:
  # 1. NPM / PNPM ECOSYSTEM MONITORING
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "devsecops"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Group minor and patch updates to minimize PR fatigue; isolate major upgrades
    groups:
      production-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      development-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    # Security updates bypass grouping and generate dedicated priority alerts
    ignore:
      # Major breaking versions are evaluated manually to avoid unexpected breakage
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  # 2. GITHUB ACTIONS CI/CD WORKFLOW MONITORING
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "github-actions"
      - "devsecops"
      - "automated"
    commit-message:
      prefix: "ci(actions)"
      include: "scope"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
