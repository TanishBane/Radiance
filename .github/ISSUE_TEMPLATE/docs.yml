name: Documentation Improvement
description: Suggest a fix, clarification, or addition to the Radiance documentation.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping keep our documentation clear, accurate, and up-to-date!
  - type: input
    id: path
    attributes:
      label: Documentation Page or File Path
      description: Which document needs improvement? (e.g., README.md, docs/getting-started/installation.md)
      placeholder: "README.md"
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is unclear, missing, or inaccurate?
      description: Provide details on what should be corrected or expanded.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested Correction
      description: How should the documentation read instead?
    validations:
      required: false
