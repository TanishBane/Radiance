name: Bug Report
description: Create a report to help us fix an unexpected issue or defect.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug in **RADIANCE**! Please provide sufficient details to help reproduce and diagnose the issue.
  - type: input
    id: version
    attributes:
      label: Radiance Version or Commit SHA
      description: What version or git commit of Radiance are you running?
      placeholder: "e.g. 1.0.0 or commit abc1234"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Operating System & Browser
      description: Which environment did you observe the problem on?
      options:
        - Chrome / Chromium
        - Safari / WebKit (macOS / iOS)
        - Firefox / Gecko
        - Mobile Chrome (Android)
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Navigate to '/'
        2. Open the model selector
        3. Type a message and tap send
        4. Observe unexpected behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Screenshots or Console Logs
      description: Paste browser console errors, terminal output, or drag-and-drop screenshots here.
    validations:
      required: false
